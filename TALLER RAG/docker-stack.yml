# Stack de Docker Swarm para la capa de datos del RAG.
#
# La aplicacion (api, frontend, ollama) NO va en este stack: Docker Swarm no
# soporta paso de dispositivos (devices) ni privileged en un servicio, y el
# cgroup bloquea /dev/kfd con "Operation not permitted". La app usa la GPU AMD
# y se levanta con docker compose en la estacion, apuntando a Milvus por LAN.
#
# Uso: scripts/up.sh up | down | status | logs
# Despliegue manual: docker --context server stack deploy -c docker-stack.yml taller-rag

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - rag
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      placement:
        constraints: [node.labels.role==data]
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "4"
          memory: 2G

  minio:
    # MinIO retiro sus imagenes oficiales en 2026; se usa el espejo legacy de
    # Bitnami, fijado por digest. Ver docs/DECISIONES.md (ADR-014).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    user: "0"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - rag
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      placement:
        constraints: [node.labels.role==data]
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "4"
          memory: 2G

  milvus:
    image: milvusdb/milvus:v2.6.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - rag
    ports:
      # Modo host: la app local llega a 192.168.1.100:19530 sin tunel SSH.
      - target: 19530
        published: 19530
        mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
    deploy:
      placement:
        constraints: [node.labels.role==data]
      restart_policy:
        condition: on-failure
        delay: 15s
      resources:
        limits:
          cpus: "8"
          memory: 10G

  solr:
    image: ${SOLR_IMAGE:-solr:9}
    volumes:
      - solr_data:/var/solr
    networks:
      - rag
    ports:
      - target: 8983
        published: ${SOLR_PORT:-8983}
        mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 15s
      timeout: 10s
      retries: 20
    deploy:
      placement:
        constraints: [node.labels.role==data]
      restart_policy:
        condition: on-failure
        delay: 15s
      resources:
        limits:
          cpus: "${SOLR_CPUS:-2}"
          memory: ${SOLR_MEMORY:-4G}

networks:
  rag:
    driver: overlay
    attachable: true

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  solr_data:
